name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check and build
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Work out version
        id: v
        run: |
          CURRENT=$(jq -r '.version' manifest.json)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "${{ github.event.inputs.release_type }}" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
            echo "full=true" >> $GITHUB_OUTPUT
          else
            # Count existing pre-release tags (including ones whose releases were deleted)
            COUNT=$(git tag -l "${CURRENT}-pre-release.*" | wc -l)
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            VERSION="${CURRENT}-pre-release.$((COUNT + 1))-${SHORT_SHA}"
            echo "full=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          if [ "${{ steps.v.outputs.full }}" == "true" ]; then
            # Since the previous full release (--exclude skips pre-release tags)
            LAST_TAG=$(git describe --tags --abbrev=0 --match="[0-9]*.[0-9]*.[0-9]*" --exclude="*-*" 2>/dev/null || echo "")
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)")
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${LAST_TAG}..HEAD")
          fi
          COMMITS=$(echo "$COMMITS" | grep -vE "^- Release version [0-9]" || true)
          {
            echo "### Changes"
            if [ -n "$COMMITS" ]; then echo "$COMMITS"; else echo "- No changes"; fi
          } > changelog.txt

      - name: Bump manifest, package and versions (full release only)
        if: steps.v.outputs.full == 'true'
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' manifest.json > tmp.json && mv tmp.json manifest.json
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          MIN=$(jq -r '.minAppVersion' manifest.json)
          jq --arg v "$VERSION" --arg m "$MIN" '. + {($v): $m}' versions.json > tmp.json && mv tmp.json versions.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json versions.json
          git commit -m "Release version $VERSION"
          git push

      - name: Package
        run: zip rewind-vault-${{ steps.v.outputs.version }}.zip main.js manifest.json styles.css

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "main.js,manifest.json,styles.css,rewind-vault-${{ steps.v.outputs.version }}.zip"
          tag: ${{ steps.v.outputs.version }}
          commit: ${{ github.sha }}
          name: ${{ steps.v.outputs.version }}
          bodyFile: changelog.txt
          prerelease: ${{ steps.v.outputs.full != 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old pre-releases (keep 25)
        if: steps.v.outputs.full != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            const old = releases
              .filter(r => r.prerelease && r.tag_name.includes('-pre-release.'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(25);
            for (const r of old) {
              await github.rest.repos.deleteRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: r.id });
              try {
                await github.rest.git.deleteRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${r.tag_name}` });
              } catch (e) { console.log(`Could not delete tag ${r.tag_name}: ${e.message}`); }
            }
